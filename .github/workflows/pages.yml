name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Собрать статическую версию
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /kvarta-landing
          # Заявки: если задать LEAD_ENDPOINT, форма будет отправлять их на ваш сервер.
          # Пока переменная пустая, форма на Pages подскажет телефон и Telegram.
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          # Либо приёмник писем без своего сервера (FormSubmit): пришлите адрес в переменную
          # репозитория FORM_RELAY_EMAIL — и заявки будут падать на почту.
          NEXT_PUBLIC_FORM_RELAY_EMAIL: ${{ vars.FORM_RELAY_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://jaraslaukunin.github.io' }}
        run: npm run build:static

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
